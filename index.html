<script>
/* Correção necessária no WKWebView do iOS: o preset "react" padrão do
   Babel Standalone tenta usar import() dinâmico para carregar plugins,
   o que o WebView do Capacitor não suporta. Registramos um preset
   equivalente manualmente, sem import(). */
Babel.registerPreset("react-classic", {
  plugins: [
    [Babel.availablePlugins["transform-react-jsx"], { runtime: "classic" }]
  ]
});
</script>

  html, body { margin: 0; padding: 0; background: #E7DEC3; }

  #boot-error {
    display: none;
    position: fixed;
    inset: 0;
    background: #7C2032;
    color: #FBF6E9;
    font-family: -apple-system, sans-serif;
    padding: 24px;
    box-sizing: border-box;
    overflow: auto;
    z-index: 9999;
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.5;
  }
</style>

<div id="root"></div>
<div id="boot-error"></div>

<script>
window.addEventListener("error", function (e) {
  var box = document.getElementById("boot-error");
  if (!box) return;
  box.style.display = "block";
  box.textContent =
    "Ocorreu um erro ao carregar o app:\n\n" +
    (e.message || "erro desconhecido") +
    (e.filename ? "\n\nArquivo: " + e.filename + ":" + e.lineno : "");
});

window.storage = {
  get: function (key) {
    return new Promise(function (resolve) {
      try {
        var raw = localStorage.getItem("hs_" + key);
        if (raw === null) { resolve(null); return; }
        resolve({ key: key, value: raw, shared: false });
      } catch (e) { resolve(null); }
    });
  },
  set: function (key, value) {
    return new Promise(function (resolve) {
      try {
        localStorage.setItem("hs_" + key, value);
        resolve({ key: key, value: value, shared: false });
      } catch (e) { resolve(null); }
    });
  },
  delete: function (key) {
    return new Promise(function (resolve) {
      try {
        localStorage.removeItem("hs_" + key);
        resolve({ key: key, deleted: true, shared: false });
      } catch (e) { resolve(null); }
    });
  },
  list: function (prefix) {
    return new Promise(function (resolve) {
      try {
        var p = "hs_" + (prefix || "");
        var keys = Object.keys(localStorage)
          .filter(function (k) { return k.indexOf(p) === 0; })
          .map(function (k) { return k.slice(3); });
        resolve({ keys: keys, prefix: prefix, shared: false });
      } catch (e) { resolve(null); }
    });
  }
};
</script>

function t(lang, key, vars) {
  let str = (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.pt[key] || key;
  if (vars) {
    Object.keys(vars).forEach((k) => {
      str = str.replace(`{${k}}`, vars[k]);
    });
  }
  return str;
}

const MAX_QUIZ_WORDS = 25;

/* ---------------------------------------------------------
   Utilidades
--------------------------------------------------------- */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuiz(category, lang) {
  const pool = shuffle(category.words).slice(0, MAX_QUIZ_WORDS);
  const items = pool.map((w) => {
    const distractors = shuffle(
      category.words.filter((o) => o[lang] !== w[lang])
    ).slice(0, 3);
    const options = shuffle([w[lang], ...distractors.map((d) => d[lang])]);
    return { word: w, options, correct: w[lang], categoryId: category.id };
  });
  return items;
}

// Monta um quiz combinando várias pastas, alternando entre elas (round-robin),
// limitado a MAX_QUIZ_WORDS perguntas no total.
function buildCombinedQuiz(categoryIds, lang) {
  const cats = categoryIds.map((id) => CATEGORY_MAP[id]).filter(Boolean);
  const pools = cats.map((c) => ({
    catId: c.id,
    accent: c.accent,
    words: shuffle(c.words),
  }));
  const result = [];
  let round = 0;
  while (result.length < MAX_QUIZ_WORDS) {
    let addedAny = false;
    for (const pool of pools) {
      if (result.length >= MAX_QUIZ_WORDS) break;
      const w = pool.words[round];
      if (!w) continue;
      addedAny = true;
      const cat = CATEGORY_MAP[pool.catId];
      const distractors = shuffle(
        cat.words.filter((o) => o[lang] !== w[lang])
      ).slice(0, 3);
      const options = shuffle([w[lang], ...distractors.map((d) => d[lang])]);
      result.push({ word: w, options, correct: w[lang], categoryId: pool.catId, accent: cat.accent });
    }
    round += 1;
    if (!addedAny) break;
  }
  return result;
}

/* ---------------------------------------------------------
   Persistência (window.storage)
--------------------------------------------------------- */
function defaultProgress() {
  return Object.fromEntries(
    CATEGORIES.map((c) => [c.id, { studied: new Set(), quizBest: null }])
  );
}

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((resolve) => setTimeout(() => resolve(null), ms)),
  ]);
}

async function loadOneCategoryProgress(catId) {
  try {
    if (!window.storage || typeof window.storage.get !== "function") {
      return { studied: new Set(), quizBest: null };
    }
    const res = await withTimeout(window.storage.get(`progress:${catId}`, false), 4000);
    if (res && res.value) {
      const parsed = JSON.parse(res.value);
      return {
        studied: new Set(parsed.studied || []),
        quizBest: parsed.quizBest || null,
      };
    }
    return { studied: new Set(), quizBest: null };
  } catch (e) {
    return { studied: new Set(), quizBest: null };
  }
}

async function saveProgress(categoryId, progressForCat) {
  try {
    if (!window.storage || typeof window.storage.set !== "function") return;
    await window.storage.set(
      `progress:${categoryId}`,
      JSON.stringify({
        studied: Array.from(progressForCat.studied),
        quizBest: progressForCat.quizBest,
      }),
      false
    );
  } catch (e) {
    console.error("Erro ao salvar progresso", e);
  }
}

async function loadLanguage() {
  try {
    if (!window.storage || typeof window.storage.get !== "function") return null;
    const res = await withTimeout(window.storage.get("settings:lang", false), 3000);
    if (res && res.value) return res.value;
    return null;
  } catch (e) {
    return null;
  }
}

async function saveLanguage(lang) {
  try {
    if (!window.storage || typeof window.storage.set !== "function") return;
    await window.storage.set("settings:lang", lang, false);
  } catch (e) {
    console.error("Erro ao salvar idioma", e);
  }
}

/* ---------------------------------------------------------
   App
--------------------------------------------------------- */
function App() {
  const [lang, setLang] = useState(null); // null = ainda não escolhido / carregando
  const [view, setView] = useState("categories"); // categories | cards | quiz | quizBuilder
  const [openCatId, setOpenCatId] = useState(null);
  const [flipped, setFlipped] = useState({});
  const [deckIndex, setDeckIndex] = useState({}); // categoryId -> index atual no baralho
  const [progress, setProgress] = useState(defaultProgress);
  const [syncing, setSyncing] = useState(true);
  const [quiz, setQuiz] = useState(null);
  const [quizBuilderSelection, setQuizBuilderSelection] = useState([]);

  useEffect(() => {
    let mounted = true;
    Promise.all([
      loadLanguage(),
      Promise.all(CATEGORIES.map((c) => loadOneCategoryProgress(c.id).then((p) => [c.id, p]))),
    ])
      .then(([savedLang, pairs]) => {
        if (!mounted) return;
        setProgress((prev) => {
          const next = { ...prev };
          for (const [id, p] of pairs) next[id] = p;
          return next;
        });
        setLang(savedLang || "__choose__");
      })
      .catch(() => {
        if (mounted) setLang("__choose__");
      })
      .finally(() => {
        if (mounted) setSyncing(false);
      });
    return () => {
      mounted = false;
    };
  }, []);

  const chooseLanguage = (code) => {
    setLang(code);
    saveLanguage(code);
  };

  const markStudied = useCallback((categoryId, index) => {
    setProgress((prev) => {
      if (!prev) return prev;
      const catProg = prev[categoryId] || { studied: new Set(), quizBest: null };
      if (catProg.studied.has(index)) return prev;
      const nextSet = new Set(catProg.studied);
      nextSet.add(index);
      const nextCatProg = { ...catProg, studied: nextSet };
      const next = { ...prev, [categoryId]: nextCatProg };
      saveProgress(categoryId, nextCatProg);
      return next;
    });
  }, []);

  const saveQuizResult = useCallback((categoryId, score, total) => {
    setProgress((prev) => {
      if (!prev) return prev;
      const catProg = prev[categoryId] || { studied: new Set(), quizBest: null };
      const prevBest = catProg.quizBest;
      const isBetter = !prevBest || score / total > prevBest.score / prevBest.total;
      const nextBest = isBetter ? { score, total } : prevBest;
      const nextCatProg = { ...catProg, quizBest: nextBest };
      const next = { ...prev, [categoryId]: nextCatProg };
      saveProgress(categoryId, nextCatProg);
      return next;
    });
  }, []);

  const toggleFlip = (key, categoryId, index) => {
    setFlipped((f) => {
      const nowFlipped = !f[key];
      if (nowFlipped) markStudied(categoryId, index);
      return { ...f, [key]: nowFlipped };
    });
  };

  const openCategory = (id) => {
    setOpenCatId(id);
    setView("cards");
  };

  const startQuiz = (id) => {
    const cat = CATEGORY_MAP[id];
    setQuiz({
      mode: "single",
      categoryId: id,
      items: buildQuiz(cat, lang),
      index: 0,
      score: 0,
      selected: null,
      finished: false,
    });
    setView("quiz");
  };

  const startCombinedQuiz = () => {
    if (quizBuilderSelection.length === 0) return;
    setQuiz({
      mode: "combined",
      categoryIds: quizBuilderSelection,
      items: buildCombinedQuiz(quizBuilderSelection, lang),
      index: 0,
      score: 0,
      selected: null,
      finished: false,
    });
    setView("quiz");
  };

  const category = openCatId ? CATEGORY_MAP[openCatId] : null;
  const strings = lang && lang !== "__choose__" ? lang : "pt";

  if (lang === null) {
    return <div style={styles.page} />;
  }

  return (
    <div style={styles.page}>
      <style>{GLOBAL_CSS}</style>

      {syncing && <div style={styles.syncBadge}>…</div>}

      {lang === "__choose__" ? (
        <LanguageSelect onChoose={chooseLanguage} />
      ) : view === "categories" ? (
        <CategoryGrid
          lang={lang}
          onOpen={openCategory}
          progress={progress}
          onChangeLanguage={() => setLang("__choose__")}
          onOpenQuizBuilder={() => {
            setQuizBuilderSelection([]);
            setView("quizBuilder");
          }}
        />
      ) : view === "quizBuilder" ? (
        <QuizBuilder
          lang={lang}
          selection={quizBuilderSelection}
          setSelection={setQuizBuilderSelection}
          onBack={() => setView("categories")}
          onStart={startCombinedQuiz}
        />
      ) : view === "cards" ? (
        <CardDeck
          lang={lang}
          category={category}
          flipped={flipped}
          toggleFlip={toggleFlip}
          deckIndex={deckIndex[category.id] || 0}
          setDeckIndexForCat={(i) =>
            setDeckIndex((prev) => ({ ...prev, [category.id]: i }))
          }
          onBack={() => setView("categories")}
          onQuiz={() => startQuiz(category.id)}
          studied={progress[category.id]?.studied || new Set()}
        />
      ) : (
        <QuizView
          lang={lang}
          quiz={quiz}
          setQuiz={setQuiz}
          onFinish={(score, total) => {
            if (quiz.mode === "single") saveQuizResult(quiz.categoryId, score, total);
          }}
          onExit={() => setView(quiz && quiz.mode === "combined" ? "categories" : "cards")}
          bestScore={
            quiz && quiz.mode === "single" ? progress[quiz.categoryId]?.quizBest : null
          }
        />
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Tela: baralho de cartas (uma por vez, com deslizar)
--------------------------------------------------------- */
function CardDeck({ lang, category, flipped, toggleFlip, deckIndex, setDeckIndexForCat, onBack, onQuiz, studied }) {
  const total = category.words.length;
  const index = Math.min(deckIndex, total - 1);
  const word = category.words[index];
  const key = category.id + index;
  const isFlipped = !!flipped[key];
  const isStudied = studied.has(index);

  const touchRef = React.useRef({ x: 0, active: false });

  const goTo = (newIndex) => {
    if (newIndex < 0 || newIndex >= total) return;
    setDeckIndexForCat(newIndex);
  };

  const onTouchStart = (e) => {
    touchRef.current = { x: e.touches[0].clientX, active: true };
  };
  const onTouchEnd = (e) => {
    if (!touchRef.current.active) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    touchRef.current.active = false;
    if (Math.abs(dx) < 40) return;
    if (dx < 0) goTo(index + 1);
    else goTo(index - 1);
  };

  return (
    <div style={styles.container}>
      <header style={styles.header}>
        <button className="back-btn" onClick={onBack} style={styles.backBtn}>
          &larr; {t(lang, "backToFolders")}

        <div style={styles.headerRow}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <span style={styles.catIconSmall}>{category.icon}</span>
            <div>
              <h1 style={{ ...styles.title, fontSize: 28 }}>{category.nameLoc[lang] || category.name}</h1>
              <p style={styles.subtitle}>
                {studied.size}/{total} {t(lang, "studied")}
              </p>
            </div>
          </div>
          <button className="action-btn" onClick={onQuiz} style={{ ...styles.quizBtn, background: category.accent }}>
            {t(lang, "startQuiz")}
          </button>
        </div>
      </header>

      <div style={styles.deckArea} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
        {/* cartas decorativas empilhadas atrás */}
        <div style={{ ...styles.stackCard, transform: "translate(10px, 10px) rotate(4deg)" }} />
        <div style={{ ...styles.stackCard, transform: "translate(5px, 5px) rotate(-3deg)" }} />

        <div className="card-flip-outer" style={styles.deckFlipOuter} onClick={() => toggleFlip(key, category.id, index)}>
          <div className={`card-flip-inner ${isFlipped ? "is-flipped" : ""}`}>
            <div className="card-face" style={{ ...styles.deckFace, borderTop: `8px solid ${category.accent}` }}>
              {isStudied && <div style={{ ...styles.studiedDot, background: category.accent }} />}
              <div style={styles.hole} />
              <div style={styles.deckFrontBody}>
                <div style={styles.deckHebrewWord}>{word.he}</div>
                <div style={{ ...styles.deckTranslit, color: category.accent }}>{word.tr}</div>
              </div>
              <div style={styles.flipHint}>{t(lang, "tapToFlip")}</div>
            </div>

            <div className="card-face card-back" style={{ ...styles.deckFace, borderTop: `8px solid ${category.accent}` }}>
              <div style={styles.hole} />
              <div style={styles.deckBackBody}>
                <span style={{ ...styles.deckMeaningLabel, color: category.accent, borderColor: category.accent }}>
                  {LANGUAGES.find((l) => l.code === lang)?.flag}
                </span>
                <span style={styles.deckMeaningValue}>{word[lang]}</span>
              </div>
              <div style={styles.flipHint}>{t(lang, "tapToFlip")}</div>
            </div>
          </div>
        </div>
      </div>

      <div style={styles.deckNav}>
        <button
          className="action-btn"
          onClick={() => goTo(index - 1)}
          disabled={index === 0}
          style={{ ...styles.deckNavBtn, opacity: index === 0 ? 0.35 : 1 }}
        >
          ←
        </button>
        <span style={styles.deckCounter}>{t(lang, "cardOf", { n: index + 1, total })}</span>
        <button
          className="action-btn"
          onClick={() => goTo(index + 1)}
          disabled={index === total - 1}
          style={{ ...styles.deckNavBtn, opacity: index === total - 1 ? 0.35 : 1 }}
        >
          →
        </button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Tela: quiz (individual ou combinado)
--------------------------------------------------------- */
function QuizView({ lang, quiz, setQuiz, onFinish, onExit, bestScore }) {
  if (!quiz) return null;
  const isCombined = quiz.mode === "combined";
  const category = !isCombined ? CATEGORY_MAP[quiz.categoryId] : null;
  const accentColor = isCombined ? "#7C2032" : category.accent;
  const glyph = isCombined ? "🎲" : category.glyph;

  if (quiz.finished) {
    const pct = Math.round((quiz.score / quiz.items.length) * 100);
    return (
      <div style={styles.container}>
        <div style={styles.quizResultWrap}>
          <div style={{ ...styles.headerGlyph, color: accentColor, fontSize: 54 }}>{glyph}</div>
          <h2 style={styles.resultTitle}>{t(lang, "resultTitle")}</h2>
          <p style={styles.resultCategory}>
            {isCombined ? t(lang, "combinedQuizHeader") : category.nameLoc[lang] || category.name}
          </p>
          <div style={{ ...styles.resultScore, color: accentColor }}>
            {quiz.score} / {quiz.items.length}
          </div>
          <p style={styles.resultPct}>{pct}%</p>
          {bestScore && (
            <p style={styles.resultBest}>
              {t(lang, "bestResult")}: {bestScore.score}/{bestScore.total}
            </p>
          )}
          <div style={styles.resultActions}>
            <button
              className="action-btn"
              style={{ ...styles.quizBtn, background: accentColor }}
              onClick={() =>
                setQuiz(
                  isCombined
                    ? {
                        mode: "combined",
                        categoryIds: quiz.categoryIds,
                        items: buildCombinedQuiz(quiz.categoryIds, lang),
                        index: 0,
                        score: 0,
                        selected: null,
                        finished: false,
                      }
                    : {
                        mode: "single",
                        categoryId: category.id,
                        items: buildQuiz(category, lang),
                        index: 0,
                        score: 0,
                        selected: null,
                        finished: false,
                      }
                )
              }
            >
              {t(lang, "redoQuiz")}
            </button>
            <button className="back-btn" style={styles.backBtnBig} onClick={onExit}>
              &larr; {isCombined ? t(lang, "backToHome") : t(lang, "backToCards")}
            </button>
          </div>
        </div>
      </div>
    );
  }

  const q = quiz.items[quiz.index];
  const answered = quiz.selected !== null;
  const qAccent = isCombined ? q.accent : accentColor;

  const choose = (opt) => {
    if (answered) return;
    const correct = opt === q.correct;
    setQuiz((prev) => ({ ...prev, selected: opt, score: prev.score + (correct ? 1 : 0) }));
  };

  const next = () => {
    const isLast = quiz.index + 1 >= quiz.items.length;
    if (isLast) {
      onFinish(quiz.score, quiz.items.length);
      setQuiz((prev) => ({ ...prev, finished: true }));
    } else {
      setQuiz((prev) => ({ ...prev, index: prev.index + 1, selected: null }));
    }
  };

  return (
    <div style={styles.container}>
      <header style={styles.header}>
        <button className="back-btn" onClick={onExit} style={styles.backBtn}>
          &larr; {t(lang, "exitQuiz")}
        </button>
        <div style={styles.headerRow}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ ...styles.headerGlyph, color: accentColor, fontSize: 34 }}>{glyph}</div>
            <div>
              <h1 style={{ ...styles.title, fontSize: 24 }}>
                {isCombined ? t(lang, "combinedQuizHeader") : category.nameLoc[lang] || category.name}
              </h1>
              <p style={styles.subtitle}>
                {t(lang, "quizQuestionOf", { n: quiz.index + 1, total: quiz.items.length })} &middot; {t(lang, "points")}: {quiz.score}
              </p>
            </div>
          </div>
        </div>
      </header>

      <div style={styles.quizCard}>
        <div style={styles.quizHebrew}>{q.word.he}</div>
        <div style={{ ...styles.quizTranslit, color: qAccent }}>{q.word.tr}</div>
        <p style={styles.quizPrompt}>{t(lang, "whatIsMeaning")}</p>

        <div style={styles.quizOptions}>
          {q.options.map((opt) => {
            let bg = "#FBF6E9";
            let border = "#d8cba9";
            let textColor = "#241E1A";
            if (answered) {
              if (opt === q.correct) {
                bg = "#e4f0e2";
                border = "#4c7a44";
                textColor = "#2f5233";
              } else if (opt === quiz.selected) {
                bg = "#f6e2e2";
                border = "#a14343";
                textColor = "#7c2032";
              }
            }
            return (
              <button
                key={opt}
                className="quiz-opt"
                onClick={() => choose(opt)}
                style={{
                  ...styles.quizOptBtn,
                  background: bg,
                  borderColor: border,
                  color: textColor,
                  cursor: answered ? "default" : "pointer",
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>

        {answered && (
          <button
            className="action-btn"
            onClick={next}
            style={{ ...styles.quizBtn, background: qAccent, marginTop: 22 }}
          >
            {quiz.index + 1 >= quiz.items.length ? t(lang, "seeResult") : t(lang, "nextQuestion")}
          </button>
        )}
      </div>
    </div>
  );
}
